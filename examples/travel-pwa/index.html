<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c2a5e" />
    <meta
      name="description"
      content="Web 標準だけで、アプリとチャット AI の間を構造化データで往復させる TypeScript ライブラリ。"
    />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <title>uweb-cp</title>
    <style>
      /* 本文に Web フォントを使わない。README らしさと初期表示の速さの両方のため。 */
      :root {
        --bg: #fcfcfd;
        --ink: #1a1d23;
        --dim: #55606f;
        --line: #dfe2e8;
        --hair: #eceef2;
        --code-bg: #f3f4f7;
        --link: #1a4fb8;
        --navy: #1c2a5e;
        --ok: #1a6b4f;
        --bad: #a3282d;
        --warn: #8a5a12;
        --field: #fff;

        --sys:
          system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic UI', sans-serif;
        --mono: ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #14171c;
          --ink: #e4e8ee;
          --dim: #949daa;
          --line: #2c323b;
          --hair: #23282f;
          --code-bg: #1b1f25;
          --link: #7ea3f0;
          --navy: #b9c9f5;
          --ok: #45b894;
          --bad: #e8797d;
          --warn: #d9a45a;
          --field: #191d23;
        }
      }

      :root[data-theme='dark'] {
        --bg: #14171c;
        --ink: #e4e8ee;
        --dim: #949daa;
        --line: #2c323b;
        --hair: #23282f;
        --code-bg: #1b1f25;
        --link: #7ea3f0;
        --navy: #b9c9f5;
        --ok: #45b894;
        --bad: #e8797d;
        --warn: #d9a45a;
        --field: #191d23;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: max(20px, env(safe-area-inset-top)) 16px calc(56px + env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sys);
        font-size: 15px;
        line-height: 1.9;
        -webkit-text-size-adjust: 100%;
      }

      main {
        max-width: 760px;
        margin: 0 auto;
      }

      /* ---- README から来る要素 ---- */

      h1 {
        font-family: var(--mono);
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--navy);
        margin: 0 0 14px;
      }

      h2 {
        font-size: 16px;
        font-weight: 600;
        margin: 38px 0 12px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--hair);
        scroll-margin-top: 16px;
      }

      h2 .anchor {
        font-family: var(--mono);
        font-weight: 400;
        color: var(--line);
        text-decoration: none;
        margin-right: 7px;
      }

      h2:hover .anchor {
        color: var(--dim);
      }

      p {
        margin: 0 0 13px;
        max-width: 64ch;
      }

      a {
        color: var(--link);
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      strong {
        font-weight: 600;
      }

      /* バッジ列 */
      p:has(> a > img) {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        line-height: 1;
        margin-bottom: 18px;
      }

      img {
        max-width: 100%;
        vertical-align: middle;
      }

      pre {
        margin: 0 0 14px;
        padding: 13px 15px;
        background: var(--code-bg);
        border: 1px solid var(--hair);
        border-radius: 4px;
        overflow-x: auto;
        font-family: var(--mono);
        font-size: 12.5px;
        line-height: 1.75;
      }

      code {
        font-family: var(--mono);
        font-size: 0.88em;
        background: var(--code-bg);
        border-radius: 3px;
        padding: 1px 4px;
      }

      pre code {
        background: none;
        padding: 0;
        font-size: 1em;
      }

      ul {
        margin: 0 0 14px;
        padding-left: 22px;
      }

      li {
        margin-bottom: 3px;
        max-width: 62ch;
      }

      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13.5px;
        margin: 0 0 14px;
        display: block;
        overflow-x: auto;
      }

      th,
      td {
        text-align: left;
        padding: 8px 14px 8px 0;
        border-bottom: 1px solid var(--hair);
        vertical-align: top;
      }

      /* ---- デモ（README のマーカー位置に差し込まれる） ---- */

      .demo {
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 16px;
        margin: 0 0 14px;
      }

      .duo {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }

      .step {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.06em;
        color: var(--dim);
        margin: 0 0 10px;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 7px;
      }

      .row > .k {
        font-size: 12px;
        color: var(--dim);
        width: 52px;
        flex: none;
      }

      input,
      textarea,
      select,
      button {
        font-family: inherit;
        font-size: 13px;
        color: inherit;
        border: 1px solid var(--line);
        border-radius: 3px;
        background: var(--field);
        padding: 5px 8px;
        min-width: 0;
      }

      input,
      select {
        flex: 1;
      }

      textarea {
        width: 100%;
        min-height: 92px;
        resize: vertical;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.7;
      }

      button {
        cursor: pointer;
        background: var(--navy);
        border-color: var(--navy);
        color: var(--bg);
        font-weight: 500;
        padding: 5px 13px;
      }

      button.sub {
        background: transparent;
        border-color: var(--line);
        color: var(--ink);
        font-weight: 400;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .hint {
        font-size: 12px;
        color: var(--dim);
        margin: 8px 0 0;
      }

      #instruction {
        min-height: 56px;
      }

      #preview {
        margin-top: 9px;
        max-height: 280px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }

      /* ---- 取り込んだ結果 ---- */

      #result-card {
        border-top: 1px solid var(--hair);
        margin-top: 16px;
        padding-top: 14px;
      }

      .day {
        border-top: 1px solid var(--hair);
        margin-top: 10px;
        padding-top: 10px;
      }

      .day:first-of-type {
        border-top: 0;
        margin-top: 0;
        padding-top: 0;
      }

      .day h3 {
        font-size: 13.5px;
        margin: 0 0 5px;
        font-weight: 600;
      }

      .day ul {
        margin: 0;
        padding-left: 20px;
      }

      .day time {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--dim);
        margin-right: 7px;
      }

      .note {
        color: var(--dim);
        font-size: 12.5px;
      }

      /* ---- 診断（既定では畳む） ---- */

      details {
        margin-top: 14px;
        border-top: 1px solid var(--hair);
        padding-top: 10px;
      }

      summary {
        font-size: 12.5px;
        color: var(--dim);
        cursor: pointer;
      }

      .caps {
        display: grid;
        gap: 2px;
        font-family: var(--mono);
        font-size: 11.5px;
        margin-top: 10px;
      }

      .caps div {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        border-bottom: 1px solid var(--hair);
        padding: 2px 0;
      }

      .caps span:last-child {
        color: var(--dim);
      }

      .yes {
        color: var(--ok) !important;
      }

      #log {
        list-style: none;
        margin: 10px 0 0;
        padding: 0;
        font-family: var(--mono);
        font-size: 11.5px;
        display: grid;
        gap: 3px;
        max-height: 200px;
        overflow-y: auto;
      }

      #log li {
        color: var(--dim);
        border-left: 2px solid var(--hair);
        padding-left: 9px;
        margin: 0;
        max-width: none;
      }

      #log li.ok {
        border-color: var(--ok);
        color: var(--ink);
      }

      #log li.warn {
        border-color: var(--warn);
      }

      #log li.bad {
        border-color: var(--bad);
      }

      #drop {
        border: 1px dashed var(--line);
        border-radius: 3px;
        padding: 7px;
        text-align: center;
        font-size: 11.5px;
        color: var(--dim);
        margin-top: 7px;
      }

      #drop.over {
        border-color: var(--navy);
        color: var(--ink);
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 620px) {
        .duo {
          grid-template-columns: 1fr;
          gap: 20px;
        }

        /* 2 列の対比表は、狭いと 1 列目が潰れて読めなくなるので縦に積む */
        tbody tr {
          display: block;
          border-bottom: 1px solid var(--hair);
          padding: 7px 0;
        }

        tbody td {
          display: block;
          border: 0;
          padding: 0;
        }

        tbody td:first-child {
          margin-bottom: 1px;
        }
      }
    </style>
  </head>
  <body>
    <main><!--README--></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
