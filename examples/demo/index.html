<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c2a5e" />
    <meta
      name="description"
      content="Web 標準だけで、アプリとチャット AI の間を構造化データで往復させる TypeScript ライブラリ。"
    />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <title>uweb-cp</title>
    <style>
      /* 本文に Web フォントを使わない。README らしさと初期表示の速さの両方のため。 */
      :root {
        --bg: #fcfcfd;
        --ink: #1a1d23;
        --dim: #55606f;
        --line: #dfe2e8;
        --hair: #eceef2;
        --code-bg: #f3f4f7;
        --link: #1a4fb8;
        --navy: #1c2a5e;
        /* 差し色。生きている箇所にだけ使う (タブの選択、コピー成功、見出しのアンカー) */
        --accent: #9a6412;
        /* 図と同じ往復の向き。デモの「送る / 受け取る」と対応させる */
        --out: #3f63cf;
        --in: #0f8a6a;
        --ok: #12735a;
        --bad: #a3282d;
        --warn: #8a5a12;
        --field: #fff;
        --surface: #f7f8fa;

        --r: 4px;
        --ctl: 30px;

        --sys:
          system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic UI', sans-serif;
        --mono: ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #14171c;
          --ink: #e4e8ee;
          --dim: #949daa;
          --line: #2c323b;
          --hair: #23282f;
          --code-bg: #1b1f25;
          --link: #7ea3f0;
          --navy: #b9c9f5;
          --accent: #dfa658;
          --out: #8aa1f7;
          --in: #45b894;
          --ok: #45b894;
          --bad: #e8797d;
          --warn: #d9a45a;
          --field: #13161b;
          --surface: #1a1e25;
        }
      }

      :root[data-theme='dark'] {
        --bg: #14171c;
        --ink: #e4e8ee;
        --dim: #949daa;
        --line: #2c323b;
        --hair: #23282f;
        --code-bg: #1b1f25;
        --link: #7ea3f0;
        --navy: #b9c9f5;
        --accent: #dfa658;
        --out: #8aa1f7;
        --in: #45b894;
        --ok: #45b894;
        --bad: #e8797d;
        --warn: #d9a45a;
        --field: #13161b;
        --surface: #1a1e25;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: max(20px, env(safe-area-inset-top)) 16px calc(56px + env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sys);
        font-size: 15px;
        line-height: 1.9;
        -webkit-text-size-adjust: 100%;
      }

      main {
        max-width: 760px;
        margin: 0 auto;
      }

      /* ---- README から来る要素 ---- */

      h1 {
        font-family: var(--mono);
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--navy);
        margin: 0 0 14px;
      }

      h2 {
        font-size: 16px;
        font-weight: 600;
        margin: 38px 0 12px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--hair);
        scroll-margin-top: 16px;
      }

      h2 .anchor {
        font-family: var(--mono);
        font-weight: 400;
        color: var(--line);
        text-decoration: none;
        margin-right: 7px;
      }

      h2:hover .anchor {
        color: var(--dim);
      }

      p {
        margin: 0 0 13px;
      }

      a {
        color: var(--link);
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      strong {
        font-weight: 600;
      }

      /* バッジ列 */
      p:has(> a > img) {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        line-height: 1;
        margin-bottom: 18px;
      }

      img {
        max-width: 100%;
        vertical-align: middle;
      }

      pre {
        margin: 0 0 14px;
        padding: 13px 15px;
        background: var(--code-bg);
        border: 1px solid var(--hair);
        border-radius: 4px;
        overflow-x: auto;
        font-family: var(--mono);
        font-size: 12.5px;
        line-height: 1.75;
      }

      code {
        font-family: var(--mono);
        font-size: 0.88em;
        background: var(--code-bg);
        border-radius: 3px;
        padding: 1px 4px;
      }

      pre code {
        background: none;
        padding: 0;
        font-size: 1em;
      }

      ul {
        margin: 0 0 14px;
        padding-left: 22px;
      }

      li {
        margin-bottom: 3px;
      }

      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13.5px;
        margin: 0 0 14px;
        display: block;
        overflow-x: auto;
      }

      th,
      td {
        text-align: left;
        padding: 8px 14px 8px 0;
        border-bottom: 1px solid var(--hair);
        vertical-align: top;
      }

      /* ---- デモ（README のマーカー位置に差し込まれる） ---- */

      .demo {
        border: 1px solid var(--line);
        border-radius: var(--r);
        background: var(--surface);
        padding: 18px;
        margin: 0 0 14px;
      }

      .duo {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }

      .step {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--dim);
        margin: 0 0 10px;
      }

      .step.out {
        color: var(--out);
      }

      .step.in {
        color: var(--in);
      }

      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 7px;
      }

      input,
      textarea,
      select,
      button {
        font-family: inherit;
        font-size: 13px;
        color: inherit;
        border: 1px solid var(--line);
        border-radius: var(--r);
        background: var(--field);
        padding: 5px 8px;
        min-width: 0;
      }

      /* 入力と並ぶボタンは 1px も違わず揃っていないと安く見える */
      .demo input,
      .demo button {
        height: var(--ctl);
        padding: 0 12px;
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      input,
      select {
        flex: 1;
      }

      textarea {
        width: 100%;
        background: var(--code-bg);
        min-height: 92px;
        resize: vertical;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.7;
      }

      button {
        cursor: pointer;
        background: var(--field);
        border-color: var(--dim);
        color: var(--ink);
        font-weight: 500;
        padding: 5px 13px;
      }

      button:hover {
        border-color: var(--ink);
      }

      button.sub {
        background: transparent;
        border-color: var(--line);
        color: var(--dim);
        font-weight: 400;
      }

      button.sub:hover {
        border-color: var(--dim);
        color: var(--ink);
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .hint {
        font-size: 12px;
        color: var(--dim);
        margin: 8px 0 0;
      }

      /* 畳んだ中身。既定では見えないので、ここだけ少し詰める */
      /* ---- 取り込んだ結果 ---- */

      #result-card {
        border-top: 1px solid var(--line);
        margin-top: 14px;
        padding-top: 14px;
      }

      /* effort は enum なので、そのままバッジに流せる */
      .effort {
        display: inline-block;
        font-family: var(--mono);
        font-size: 11px;
        border-radius: 3px;
        padding: 1px 6px;
        margin-right: 8px;
      }

      .effort.small {
        color: var(--ok);
        background: color-mix(in srgb, var(--ok) 13%, transparent);
      }

      .effort.medium {
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 15%, transparent);
      }

      .effort.large {
        color: var(--bad);
        background: color-mix(in srgb, var(--bad) 13%, transparent);
      }

      .note {
        color: var(--dim);
        font-size: 12.5px;
      }

      /* ---- 状態（1 行だけ） ---- */

      .status {
        font-size: 12.5px;
        color: var(--dim);
        margin: 12px 0 0;
        min-height: 1.6em;
      }

      .status.ok {
        color: var(--ok);
      }

      .status.warn {
        color: var(--accent);
      }

      .status.bad {
        color: var(--bad);
      }

      /* ---- 受け取ったデータ ---- */

      .summary {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        align-items: baseline;
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--dim);
        margin: 0 0 12px;
      }

      .summary code {
        background: var(--code-bg);
        color: var(--navy);
      }

      .summary .ok {
        color: var(--ok);
      }

      table.data {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        display: table;
        margin: 0;
      }

      table.data th {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
        color: var(--dim);
        text-align: left;
        border-bottom: 1px solid var(--line);
        padding: 0 12px 5px 0;
      }

      table.data td {
        border-bottom: 1px solid var(--hair);
        padding: 7px 12px 7px 0;
        vertical-align: top;
      }

      table.data .title {
        font-weight: 600;
      }

      /* ---- 診断（?debug のときだけ） ---- */

      .caps {
        display: grid;
        gap: 2px;
        font-family: var(--mono);
        font-size: 11.5px;
        margin-top: 10px;
      }

      .caps div {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        border-bottom: 1px solid var(--hair);
        padding: 2px 0;
      }

      .caps span:last-child {
        color: var(--dim);
      }

      .yes {
        color: var(--ok) !important;
      }

      .bar {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 10;
        margin: 0 -16px 22px;
        padding: 9px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--bg) 86%, transparent);
        backdrop-filter: blur(10px);
        font-size: 13px;
      }

      .bar .mark {
        display: flex;
        align-items: center;
        gap: 7px;
        font-family: var(--mono);
        font-weight: 600;
        color: var(--navy);
        text-decoration: none;
      }

      .bar nav {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .bar nav a {
        color: var(--dim);
        text-decoration: none;
      }

      .bar nav a:hover {
        color: var(--ink);
        text-decoration: underline;
      }

      #theme {
        display: inline-flex;
        align-items: center;
        padding: 3px 6px;
        background: transparent;
        border-color: var(--line);
        color: var(--dim);
      }

      /* ---- コードブロック: Shiki + コピー ---- */

      .code {
        position: relative;
        margin: 0 0 14px;
      }

      .code pre {
        margin: 0;
        padding: 13px 15px;
        background: var(--code-bg);
        border: 1px solid var(--hair);
        border-radius: 4px;
        overflow-x: auto;
        font-family: var(--mono);
        font-size: 12.5px;
        line-height: 1.8;
      }

      /* Shiki の 2 テーマを CSS 側で切り替える */
      .code .shiki,
      .code .shiki span {
        color: var(--shiki-light);
        background-color: transparent;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) .code .shiki,
        :root:not([data-theme='light']) .code .shiki span {
          color: var(--shiki-dark);
        }
      }

      :root[data-theme='dark'] .code .shiki,
      :root[data-theme='dark'] .code .shiki span {
        color: var(--shiki-dark);
      }

      .copy {
        position: absolute;
        top: 6px;
        right: 6px;
        display: inline-flex;
        align-items: center;
        padding: 3px 5px;
        background: var(--bg);
        border-color: var(--line);
        color: var(--dim);
        opacity: 0;
        transition: opacity 0.12s;
      }

      .code:hover .copy,
      .copy:focus-visible {
        opacity: 1;
      }

      .copy.done {
        color: var(--accent);
        border-color: var(--accent);
        opacity: 1;
      }

      /* ---- install タブ ---- */

      .install {
        margin-bottom: 14px;
      }

      .install .tabs {
        display: flex;
        gap: 2px;
        margin-bottom: -1px;
        position: relative;
        z-index: 1;
      }

      .install .tabs button {
        font-family: var(--mono);
        font-size: 11.5px;
        padding: 2px 11px;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 4px 4px 0 0;
        color: var(--dim);
        font-weight: 400;
      }

      .install .tabs button[aria-selected='true'] {
        background: var(--code-bg);
        border-color: var(--hair);
        border-bottom-color: var(--code-bg);
        color: var(--ink);
        box-shadow: inset 0 2px 0 var(--accent);
      }

      .install .code {
        margin: 0;
      }

      .install .code pre {
        border-radius: 0 4px 4px 4px;
      }

      /* ---- 往復の図 ---- */

      .fig {
        margin: 0 0 16px;
        padding: 14px 10px;
        border: 1px solid var(--hair);
        border-radius: 4px;
      }

      .fig svg {
        display: block;
        width: 100%;
        height: auto;
      }

      /* ---- 見出しアンカー ---- */

      h2:hover .anchor {
        color: var(--accent);
      }

      /* ---- フッタ ---- */

      footer {
        margin-top: 44px;
        padding-top: 14px;
        border-top: 1px solid var(--hair);
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
        font-size: 12.5px;
        color: var(--dim);
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 620px) {
        .duo {
          grid-template-columns: 1fr;
          gap: 20px;
        }

        /* 受け取ったデータは、狭いと列が潰れるので「フィールド名: 値」に落とす */
        table.data thead {
          display: none;
        }

        table.data tr {
          display: block;
          border-bottom: 1px solid var(--line);
          padding: 8px 0;
        }

        table.data td {
          display: flex;
          gap: 8px;
          border: 0;
          padding: 1px 0;
        }

        table.data td::before {
          content: attr(data-label);
          font-family: var(--mono);
          font-size: 11px;
          color: var(--dim);
          width: 46px;
          flex: none;
        }

        /* 2 列の対比表は、狭いと 1 列目が潰れて読めなくなるので縦に積む */
        tbody tr {
          display: block;
          border-bottom: 1px solid var(--hair);
          padding: 7px 0;
        }

        tbody td {
          display: block;
          border: 0;
          padding: 0;
        }

        tbody td:first-child {
          margin-bottom: 1px;
        }
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <a class="mark" href="." aria-label="uweb-cp トップ"><span id="logo"></span>uweb-cp</a>
      <nav>
        <a href="#試してみる">試してみる</a>
        <a href="https://github.com/kuu13580/uweb-cp">GitHub</a>
        <button type="button" id="theme" aria-label="配色を切り替える"></button>
      </nav>
    </header>
    <main><!--README--></main>
    <footer>
      <span>MIT</span>
      <a href="https://github.com/kuu13580/uweb-cp">GitHub</a>
      <a href="https://github.com/kuu13580/uweb-cp/blob/main/docs/architecture.md"
        >アーキテクチャ</a
      >
      <a href="https://github.com/kuu13580/uweb-cp/blob/main/docs/protocol.md">UCP-1 封筒</a>
      <a href="https://github.com/kuu13580/uweb-cp/blob/main/CONTRIBUTING.md">CONTRIBUTING</a>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
