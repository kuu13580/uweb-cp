name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version: '22'
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp test run
      - run: vp run -r build
