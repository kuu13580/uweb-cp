name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version: '22'
          cache: true
      - run: vp install --frozen-lockfile
      # examples は uweb-cp を実際の利用者と同じく dist 経由で解決するので、
      # 型検査とテストの前にビルドが要る
      - run: vp run -r build
      - run: vp check
      - run: vp test run
