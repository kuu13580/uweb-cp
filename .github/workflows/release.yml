name: Release

# changeset version でバージョンを上げ、uweb-cp@<version> のタグを push すると
# ステージに積む。公開されるのは、人が npmjs.com で 2FA を通して承認した後。
on:
  push:
    tags: ['uweb-cp@*']
  # OIDC の疎通だけ確かめたいとき用。公開済みの版なら「既にある」で止まる
  workflow_dispatch:

permissions:
  contents: read
  # Trusted Publishing (OIDC) の要。npm のトークンは持たない
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version: '22'
          cache: true
      # staged publishing は npm 11.15.0 から。Node 22 同梱は 10 系
      - run: npm install -g npm@latest
      - run: vp install --frozen-lockfile
      - run: vp run -r build
      - run: vp check
      - run: vp test run
      - name: diagnose oidc
        run: |
          npm --version
          echo "--- ACTIONS_ID_TOKEN_REQUEST_URL ---"
          [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo present || echo MISSING
          echo "--- ~/.npmrc ---"
          sed -E 's/(_authToken=).*/\1***/' ~/.npmrc 2>/dev/null || echo "(none)"
          echo "--- repo .npmrc ---"
          cat .npmrc 2>/dev/null || echo "(none)"
          echo "--- registry ---"
          npm config get registry
          echo "--- npm config list ---"
          npm config list
      # OIDC の資格情報では承認できない。そこが人の関門である意味なので、直接 publish しない
      - run: npm stage publish
        working-directory: packages/core
